name: Deploy dashboard to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Test assignment model
        run: node job-assignments.test.cjs
      - name: Prepare public dashboard files
        run: |
          mkdir -p _site
          cp index.html date-format.js staff-module.js staff.html job-assignments.js job-assignments.html _site/
          python3 - <<'PY'
          from pathlib import Path
          path = Path('_site/index.html')
          html = path.read_text()
          marker = '</body>'
          if marker not in html:
              raise SystemExit('Dashboard body closing tag not found')
          scripts = '<script src="date-format.js"></script><script src="staff-module.js"></script><script src="job-assignments.js"></script>'
          html = html.replace(marker, scripts + marker, 1)
          path.write_text(html)
          PY
          if [ -f corex.jpg ]; then
            cp corex.jpg _site/corex.jpg
          elif [ -f corex.jpeg ]; then
            cp corex.jpeg _site/corex.jpg
          elif [ -f corex.jpg.b64 ]; then
            base64 --decode corex.jpg.b64 > _site/corex.jpg
            echo '45f1b611230d8bb1fc1d1f8015af7b3565689dd667f060d80134aa27dded9e8b  _site/corex.jpg' | sha256sum --check
          else
            echo 'Logo file is missing.' >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
