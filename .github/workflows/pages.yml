name: Deploy dashboard to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public dashboard files
        run: |
          mkdir -p _site
          cp index.html _site/
          if [ -f corex.jpg.b64 ]; then
            base64 --decode corex.jpg.b64 > _site/corex.jpg
            echo '45f1b611230d8bb1fc1d1f8015af7b3565689dd667f060d80134aa27dded9e8b  _site/corex.jpg' | sha256sum --check
          elif [ -f corex.jpg ]; then
            cp corex.jpg _site/
          else
            echo 'Logo has not been uploaded yet.'
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
